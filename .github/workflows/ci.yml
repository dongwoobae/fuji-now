name: CI/CD

# 문서만 바뀐 커밋은 검사할 코드도, 배포할 것도 없다. 빌드는 docs/와 .md를
# 읽지 않는다(2026-09-30 확인) — 빌드가 .md를 읽게 되면 이 목록부터 고친다.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 검증 job은 서로 의존하지 않아 병렬로 돈다. 배포 job만 이들 전부를 needs로 받는다.
# 빌드를 배포 job 안에 둔 것은 dist/ 산출물을 job 사이로 옮기지 않기 위해서다.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # PR에서도 빌드는 돈다(배포 스텝만 main push로 제한). 배포 경로가 깨진 것을
  # 병합 뒤에 발견하지 않기 위해서다.
  deploy:
    name: Build · Deploy
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # 새 코드가 새 테이블을 쓰므로 배포 전에 마이그레이션한다. 그래서 잠깐 옛 코드가 새 스키마 위에서 돈다.
      # 컬럼 삭제·이름 변경은 한 배포에 담지 말고 추가 → 코드 교체 → 정리로 나눈다.
      - name: Migrate database
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # YOUTUBE_API_KEY·DATABASE_URL·REPORT_CODE는 워커 secret이라 배포해도 유지된다. 여기서 넘기지 않는다.
      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
